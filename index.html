
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="./output.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">

    <h1 class="text-3xl font-bold text-green-600 text-center mb-8">Let´s know a little bit about yourself</h1>

    <form action="https://api.web3forms.com/submit" method="POST"
          class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg p-8 space-y-6">

        <input type="hidden" name="access_key" value="cb95e1f7-5d53-41fe-8caf-dca8491b0be3">
        <!--<input type="hidden" name="redirect" value="https://despliegue-example.vercel.app/datos.html"> -->

        <!-- Personal information -->
        <fieldset class="border border-gray-300 rounded-lg p-4 space-y-4">
            <legend class="px-2 font-semibold text-green-700">Informacion personal</legend>

            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                <input type="text" name="name" id="name" placeholder="Write your name here" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
            </div>

            <div>
                <label for="lastname" class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                <input type="text" name="lastname" id="lastname" placeholder="Write your last name here" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="age" class="block text-sm font-medium text-gray-700 mb-1">Age</label>
                    <input type="number" name="age" id="age" min="18" max="35" required
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
                </div>
                <div>
                    <label for="birthday" class="block text-sm font-medium text-gray-700 mb-1">Birthday</label>
                    <input type="date" name="birthday" id="birthday" required
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
                </div>
            </div>
        </fieldset>

        <!-- Multiple selection -->
        <fieldset class="border border-gray-300 rounded-lg p-4">
            <legend class="px-2 font-semibold text-green-700">Seleccion Multiple</legend>
            <div class="flex flex-wrap gap-6">
                <label class="flex items-center gap-2 text-gray-700">
                    <input type="checkbox" name="selection" value="futbol" checked class="h-4 w-4 accent-green-600"> Futbol
                </label>
                <label class="flex items-center gap-2 text-gray-700">
                    <input type="checkbox" name="selection" value="baloncesto" class="h-4 w-4 accent-green-600"> Baloncesto
                </label>
                <label class="flex items-center gap-2 text-gray-700">
                    <input type="checkbox" name="selection" value="tenis" class="h-4 w-4 accent-green-600"> Tennis
                </label>
            </div>
        </fieldset>

        <!-- Single selection -->
        <fieldset class="border border-gray-300 rounded-lg p-4">
            <legend class="px-2 font-semibold text-green-700">Estado civil</legend>
            <div class="flex flex-wrap gap-6">
                <label for="soltero" class="flex items-center gap-2 text-gray-700">
                    <input type="radio" name="uniqueS" id="soltero" value="soltero" checked required class="h-4 w-4 accent-green-600"> Soltero
                </label>
                <label for="casado" class="flex items-center gap-2 text-gray-700">
                    <input type="radio" name="uniqueS" id="casado" value="casado" required class="h-4 w-4 accent-green-600"> Casado
                </label>
                <label for="viudo" class="flex items-center gap-2 text-gray-700">
                    <input type="radio" name="uniqueS" id="viudo" value="viudo" required class="h-4 w-4 accent-green-600"> Viudo
                </label>
            </div>
        </fieldset>

        <!-- Buttons -->
        <div class="flex gap-3 justify-center pt-2">
            <button type="submit"
                    class="bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-2 rounded-full transition-colors">
                Send
            </button>
            <button type="reset"
                    class="bg-yellow-400 hover:bg-yellow-500 text-black font-semibold px-6 py-2 rounded-full transition-colors">
                Reset
            </button>
        </div>

    </form>

</body>
</html>
